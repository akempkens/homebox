# Builds this fork's Docker image and publishes it to GitHub Container Registry
# as ghcr.io/akempkens/homebox, for the Synology deployment.
#
# Upstream's docker-publish*.yaml workflows stay disabled in this fork (GitHub
# marks them "disabled_fork"); this file is fork-only, so it never conflicts
# with upstream syncs.
#
#   push to main      -> build + publish :latest, :main, :sha-<short>
#   pull request      -> build only (catches a broken build before merging)
#   manual run        -> build + publish :<branch-name> (Actions tab -> Run workflow)
name: Fork Docker publish

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/fork-docker-publish.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/fork-docker-publish.yaml'
  workflow_dispatch:

# A newer push to the same branch cancels the older, now-pointless build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0 # full history, so git describe can find the release tag

      # The fork has no release tags of its own, so borrow upstream's. The app
      # footer then shows "Version: 0.26.2 Build: <fork commit>" and the
      # "new version available" check compares against real releases.
      - name: Compute version
        id: version
        run: |
          git fetch --quiet --tags https://github.com/sysadminsmedia/homebox.git
          base=$(git describe --tags --abbrev=0)
          short=$(git rev-parse --short HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "full=${base#v}+$short" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.full }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64 # Synology is x86_64; add linux/arm64 here (plus a QEMU step) if that changes
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.base }}
            COMMIT=${{ steps.version.outputs.short }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          # Plain single-platform manifest; provenance attestations turn it into an
          # index with an "unknown/unknown" entry that older Docker builds handle poorly.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          {
            echo "### Published $VERSION"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
